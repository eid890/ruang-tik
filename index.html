<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruang TIK Wihdatul Ummah</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --hijau:#0F4C3A; --daun:#1F7A5C; --mint:#E4EFE9; --emas:#B8860B; --emas-muda:#F6EBCB;
  --kertas:#F7F9F6; --tinta:#17241F; --redup:#55655E; --garis:#D3E0D8; --putih:#FFFFFF;
  --serif:"Source Serif 4",Cambria,Georgia,serif; --sans:"Plus Jakarta Sans","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--kertas);color:var(--tinta);font-family:var(--sans);font-size:16px;line-height:1.6}
a{color:var(--daun)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--emas);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
/* bilah atas */
.atas{position:sticky;top:0;z-index:20;background:var(--hijau);color:#fff}
.atas .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.merek{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;margin-right:auto}
.merek img{width:40px;height:40px;background:#fff;border-radius:50%;padding:3px}
.merek b{font-family:var(--serif);font-size:19px;letter-spacing:.2px}
.merek small{display:block;font-size:12px;opacity:.8;font-weight:500}
nav.menu{display:flex;gap:4px;flex-wrap:wrap}
nav.menu a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14.5px}
nav.menu a:hover{background:rgba(255,255,255,.12)}
nav.menu a[aria-current="page"]{background:#fff;color:var(--hijau)}
.tombol-menu{display:none;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:8px 12px;font:600 14px var(--sans)}
@media (max-width:820px){
  .tombol-menu{display:block}
  nav.menu{display:none;position:absolute;left:0;right:0;top:64px;background:var(--hijau);flex-direction:column;padding:8px 20px 16px}
  nav.menu.buka{display:flex}
}
/* beranda */
.hero{padding:48px 0 28px}
.hero h1{font-family:var(--serif);font-size:clamp(30px,5vw,46px);line-height:1.12;margin:0 0 12px;color:var(--hijau);max-width:18ch}
.hero p.lead{font-size:18px;color:var(--redup);max-width:60ch;margin:0}
.jalur{position:relative;margin:40px 0 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.jalur::before{content:"";position:absolute;left:8%;right:8%;top:38px;height:4px;background:repeating-linear-gradient(90deg,var(--emas) 0 14px,transparent 14px 22px);z-index:0}
.stasiun{position:relative;z-index:1;text-decoration:none;color:inherit;display:block;text-align:center}
.stasiun .titik{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:var(--hijau);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:28px;font-weight:700;border:6px solid var(--kertas);box-shadow:0 0 0 2px var(--hijau)}
.stasiun:hover .titik{background:var(--daun)}
.stasiun h2{font-family:var(--serif);margin:0;font-size:22px;color:var(--tinta)}
.stasiun .peran{color:var(--emas);font-weight:700;margin:2px 0 6px}
.stasiun p{margin:0 auto;color:var(--redup);font-size:14.5px;max-width:30ch}
@media (max-width:700px){
  .jalur{grid-template-columns:1fr;gap:10px}
  .jalur::before{left:37px;right:auto;top:20px;bottom:20px;width:4px;height:auto;background:repeating-linear-gradient(180deg,var(--emas) 0 14px,transparent 14px 22px)}
  .stasiun{display:grid;grid-template-columns:76px 1fr;gap:14px;text-align:left;align-items:center}
  .stasiun .titik{margin:0}
  .stasiun p{margin:0}
}
.cari{background:#fff;border:1px solid var(--garis);border-radius:14px;padding:20px;margin:36px 0}
.cari label{font-weight:700;display:block;margin-bottom:8px}
.cari input{width:100%;font:16px var(--sans);padding:12px 14px;border:1.5px solid var(--garis);border-radius:10px;background:var(--kertas)}
.hasil{list-style:none;margin:12px 0 0;padding:0;max-height:360px;overflow:auto}
.hasil li a{display:block;padding:10px 12px;border-radius:8px;text-decoration:none;color:inherit}
.hasil li a:hover{background:var(--mint)}
.hasil small{color:var(--redup)}
.kosong{color:var(--redup);padding:8px 2px}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:48px}
@media (max-width:700px){.dua{grid-template-columns:1fr}}
.kotak{background:#fff;border:1px solid var(--garis);border-radius:14px;padding:20px 22px}
.kotak h3{font-family:var(--serif);margin:0 0 8px;color:var(--hijau);font-size:20px}
.kotak p{margin:0 0 12px;color:var(--redup)}
/* tombol unduh */
.unduh{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14.5px;padding:9px 14px;border-radius:9px;border:1.5px solid var(--daun);color:var(--hijau);background:#fff;margin:4px 6px 4px 0}
.unduh:hover{background:var(--mint)}
.unduh.utama{background:var(--hijau);border-color:var(--hijau);color:#fff}
.unduh.utama:hover{background:var(--daun)}
.unduh .jenis{font-size:11.5px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--emas-muda);color:#6B4E00}
.unduh.utama .jenis{background:rgba(255,255,255,.2);color:#fff}
/* halaman kelas */
.judul-hal{padding:34px 0 18px}
.judul-hal h1{font-family:var(--serif);color:var(--hijau);margin:0;font-size:clamp(28px,4vw,38px)}
.judul-hal p{margin:6px 0 0;color:var(--redup);max-width:70ch}
.tata{display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start;margin-bottom:56px}
@media (max-width:860px){.tata{grid-template-columns:1fr}}
.daftar{background:#fff;border:1px solid var(--garis);border-radius:14px;padding:8px;position:sticky;top:80px}
@media (max-width:860px){.daftar{position:static;display:flex;overflow-x:auto;gap:6px;padding:8px}}
.daftar h4{margin:10px 10px 4px;font-size:13px;color:var(--redup);font-weight:600}
@media (max-width:860px){.daftar h4{display:none}}
.daftar a{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--tinta);font-size:14.5px;line-height:1.3}
@media (max-width:860px){.daftar a{flex:0 0 auto;grid-template-columns:28px auto;white-space:nowrap}}
.daftar a .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--hijau);font-weight:700;font-size:13px}
.daftar a:hover{background:var(--kertas)}
.daftar a[aria-current="true"]{background:var(--hijau);color:#fff}
.daftar a[aria-current="true"] .n{background:var(--emas);color:#fff}
.modul h2{font-family:var(--serif);font-size:clamp(24px,3.4vw,32px);margin:0;color:var(--tinta);line-height:1.2}
.modul .proyek{display:inline-block;margin:10px 0 6px;background:var(--emas-muda);color:#5B4300;font-weight:700;padding:5px 12px;border-radius:999px;font-size:14px}
.modul .desk{color:var(--redup);max-width:68ch;margin:8px 0 14px}
.catatan{border-left:4px solid var(--emas);background:#fff;padding:10px 14px;border-radius:0 10px 10px 0;font-size:14.5px;margin:12px 0}
.pertemuan{background:#fff;border:1px solid var(--garis);border-radius:14px;margin:16px 0;overflow:hidden}
.pertemuan summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px 18px}
.pertemuan summary::-webkit-details-marker{display:none}
.pertemuan .no{font-family:var(--serif);font-weight:700;color:var(--hijau);font-size:15px;background:var(--mint);border-radius:10px;padding:6px 10px;white-space:nowrap}
.pertemuan h3{margin:0;font-size:17px}
.pertemuan .sub{color:var(--redup);font-size:14px}
.pertemuan .panah{color:var(--daun);font-weight:700;transition:transform .2s}
.pertemuan[open] .panah{transform:rotate(90deg)}
.pertemuan .isi{padding:0 18px 18px 18px;border-top:1px dashed var(--garis)}
.pertemuan .q{font-family:var(--serif);font-size:17px;color:var(--hijau);margin:14px 0 6px}
.pertemuan ol{margin:6px 0 0;padding-left:22px}
.pertemuan.proyek-p .no{background:var(--emas);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* dokumen */
.tabel-dok{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--garis)}
.tabel-dok th,.tabel-dok td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--garis);vertical-align:top}
.tabel-dok th{background:var(--hijau);color:#fff;font-weight:600}
.gulir{overflow-x:auto;margin-bottom:28px}
.panduan h2{font-family:var(--serif);color:var(--hijau);margin:28px 0 8px}
.panduan ol,.panduan ul{padding-left:22px}
.panduan .kotak{margin-bottom:16px}
footer{border-top:1px solid var(--garis);padding:22px 0 40px;color:var(--redup);font-size:14px}
.sembunyi{display:none}
</style>
</head>

n ukuran kertas"]},{"no":9,"judul":"Buku Digital Adab Santri","sub":"Proyek: menyusun buku digital bersama","q":"Adab apa yang menurut kalian paling penting dimiliki seorang santri?","tujuan":["Bekerja sama menulis dalam satu dokumen","Menyusun bab dengan Heading dan jeda halaman","Membuat daftar isi otomatis"]}]},{"no":4,"sem":1,"judul":"Pencarian Informasi","proyek":"Ensiklopedia Digital Mini","desk":"Santri mencari informasi dengan kata kunci yang tepat, menilai kebenaran sumber, mengenali hoaks dengan sikap tabayyun, lalu menyusun ensiklopedia mini.","alat":"Browser, Google Search, Google Docs, akun Google kelas","slide":"files/kelas7/slide/Kelas1_Modul04_Pencarian_Informasi.pptx","ma":"files/kelas7/modul-ajar/Modul_Ajar_TIK_Kelas_VII_Modul04_Pencarian_Informasi.docx","gabung":"","p":[{"no":10,"judul":"Mesin Pencari & Kata Kunci","sub":"Mencari informasi dengan tepat dan cepat","q":"Jika ingin tahu sejarah Masjid Nabawi, kata apa yang akan kalian ketik di Google?","tujuan":["Menjelaskan cara kerja mesin pencari","Menyusun kata kunci yang spesifik","Memakai tanda kutip, tanda minus, dan tab pencarian"]},{"no":11,"judul":"Sumber Terpercaya & Hoaks","sub":"Tabayyun di era digital","q":"Pernahkah kalian menerima pesan berantai yang ternyata tidak benar?","tujuan":["Menjelaskan pengertian hoaks dan cirinya","Menilai sebuah informasi dengan 4 pertanyaan","Melakukan cek fakta sederhana"]},{"no":12,"judul":"Ensiklopedia Digital Mini","sub":"Proyek: kumpulan pengetahuan dari sumber terpercaya","q":"Apa itu ensiklopedia, dan pernahkah kalian membacanya?","tujuan":["Mencari informasi dari minimal dua sumber terpercaya","Menulis entri ensiklopedia dengan bahasa sendiri","Menautkan sumber dengan link di Google Docs"]}]},{"no":5,"sem":1,"judul":"Desain Digital","proyek":"Poster Dakwah Santri","desk":"Santri memahami prinsip desain, warna, dan tipografi, lalu membuat poster dakwah yang indah dan bermanfaat menggunakan Canva versi gratis.","alat":"Canva Free (canva.com), browse   [7,8,9].forEach(k=>baris.push(["Rekap KKTP Kelas "+KELAS[k].rom,"Kriteria ketercapaian seluruh tujuan pembelajaran", unduh(DOK.kktp[k],"Unduh","DOCX")]));

  baris.push(["Bahan guru Kelas IX Modul 8","Template Google Sheets sebagai backend: Code.gs dan index.html", unduh("files/bahan-guru/Bahan_Guru_Kelas9_Modul8_Template_Sheets_Backend.zip","Unduh","ZIP")]);
  isi.innerHTML = `<section class="judul-hal"><h1>Dokumen</h1><p>Dokumen kurikulum dan bahan guru. Slide dan modul ajar per modul ada di halaman setiap kelas.</p></section>
  <div class="gulir"><table class="tabel-dok"><thead><tr><th>Dokumen</th><th>Isi</th><th>Akses</th></tr></thead><tbody>
  ${baris.map(b=>`<tr><td><b>${b[0]}</b></td><td>${b[1]}</td><td>${b[2]}</td></tr>`).join("")}</tbody></table></div>`;
  window.scrollTo(0,0);
}

function rute(){
  const h=location.hash.replace(/^#\/?/,"").split("/");
  document.querySelectorAll("nav.menu a").forEach(a=>a.removeAttribute("aria-current"));
  const tandai=href=>{const a=document.querySelector(`nav.menu a[href="${href}"]`); if(a) a.setAttribute("aria-current","page");};
  if(h[0]==="kelas" && DATA[h[1]]){ halamanKelas(h[1], h[3]||1, h[4]); tandai("#/kelas/"+h[1]); document.title="Kelas "+KELAS[h[1]].rom+" | Ruang TIK Wihdatul Ummah"; }
  else if(h[0]==="dokumen"){ dokumen(); tandai("#/dokumen"); document.title="Dokumen | Ruang TIK Wihdatul Ummah"; }
  else if(h[0]==="panduan"){ panduan(); tandai("#/panduan"); document.title="Panduan Guru | Ruang TIK Wihdatul Ummah"; }
  else { beranda(); tandai("#/"); document.title="Ruang TIK Wihdatul Ummah"; window.scrollTo(0,0); }
  document.getElementById("menu").classList.remove("buka"); document.querySelector(".tombol-menu").setAttribute("aria-expanded","false");
}
document.querySelector(".tombol-menu").addEventListener("click",e=>{const m=document.getElementById("menu"); const b=m.classList.toggle("buka"); e.currentTarget.setAttribute("aria-expanded",b);});
window.addEventListener("hashchange",rute); rute();
</script>
